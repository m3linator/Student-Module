<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f7" />
    <meta
      name="description"
      content="Persönliche App für Aufgaben, Module und Gewohnheiten im Studium."
    />

    <!-- iOS / Safari standalone web app -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="%APP_NAME%" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <title>%APP_NAME%</title>

    <!-- Apply the stored appearance before the first paint (logic mirrors src/lib/theme.ts). -->
    <script>
      (function () {
        try {
          var preference = localStorage.getItem('uni-app:theme');
          var dark =
            preference === 'dark' ||
            (preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (!dark) return;
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
          document.querySelector('meta[name="theme-color"]').content = '#000000';
        } catch (error) {
          /* storage blocked – keep light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
